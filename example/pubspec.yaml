name: photo_view_example
description: Example of how to use Photo View
publish_to: "none"
version: 1.0.1

environment:
  sdk: ">=2.12.0"

dependencies:
  flutter_svg: ^0.21.0-nullsafety.0
  cached_network_image: 3.3.1
  flutter_staggered_grid_view: 0.7.0
  path_provider: 2.1.2
  flutter_cache_manager: 3.3.1
  photo_view:
    path: ../
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/

  fonts:
    - family: PTSans
      fonts:
        - asset: assets/fonts/ptasans-regular.ttf
        - asset: assets/fonts/ptasans-bold.ttf
          weight: 700
